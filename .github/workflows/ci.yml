# The repository's own gate: does it hold together, on all three platforms?
#
# NO SIBLING CHECKOUTS, and that is the assertion. Both `databricks-target` and
# `contoso-data-product` install from the wheels their releases publish, so this
# job clones one repository and nothing else. If either dependency reached for a
# source tree again, `uv sync` here would fail with `Distribution not found` —
# which is what makes "a consumer builds against a published release" a checked
# claim rather than a sentence in the README.
#
# It used to check out two more, and the layout comment explaining why is worth
# remembering rather than deleting: a path dep is invisible until someone tries
# to clone the repository on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Repo tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: databricks-platform-jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: databricks-platform-jobs
      # THE VENDOR DECLARATION, beside this repository. `scripts/sources.py`
      # generates the vendor compose fragment from it, and the test that keeps
      # `vendor-ports.json` honest regenerates that fragment. Without this the
      # test cannot run, and a version of it that SKIPPED instead of failing
      # would have gone green here by never running at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
        working-directory: ${{ github.workspace }}
      - run: uv sync --frozen --group dev
      - run: make help
      - run: make lint
      - run: make test
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
