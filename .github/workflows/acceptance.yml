# The claim this repository exists to make: a PUBLISHED databricks-emulator
# carries the Contoso product (bronze / silver / gold / OpenMetadata).
name: Acceptance

on:
  repository_dispatch:
    types: [databricks-emulator-release]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the released emulator end to end
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        working-directory: databricks-platform-jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: databricks-platform-jobs
      # THE FAMILY'S FIGURES, from the repository that owns them. This checkout
      # was already here and unused; the step after `make verify` is what it is
      # now for.
      #
      # PINNED BY SHA, not tracking main. Core's own rules say a release is the
      # unit of change and nothing tracks main, and a nightly whose expectations
      # can move without a reviewed commit here is a nightly that can be turned
      # green by editing another repository. A SHA is also what this workflow
      # already does for every third-party action. Move it deliberately, and
      # only when the family's numbers move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-data-product
          ref: 2cf7bae8a1e1f4a8cddd2cd5510d435e16febb3b
          path: contoso-data-product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/databricks-emulator
          path: databricks-emulator
      # THE PRODUCT THIS PLATFORM RUNS. It is a separate repository now: this
      # one holds compose, the pins and the vendor generator, and nothing that
      # names Contoso. `make verify` without a PRODUCT would run the ./product
      # mount point, which is empty -- so a run that forgot this would fail at
      # the first step rather than quietly verifying nothing, but it would fail
      # for a confusing reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-data-product-databricks-jobs
          path: contoso-data-product-databricks-jobs
      # The vendors this stack pulls from are DECLARED in contoso-sources and
      # materialised from it, so both doctor.py and compose.py hard-require the
      # checkout beside this one -- `ROOT.parent / "contoso-sources"`, which is
      # the workspace root here. It is not optional and it is not a fixture we
      # could vendor: the point of reading the declaration is that this
      # platform's vendor list is not a copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        working-directory: ${{ github.workspace }}
      - if: github.event_name == 'repository_dispatch'
        name: Point at the released version
        # `uv lock` is not housekeeping, it is the second half of the move.
        # set_release.py rewrites versions.env AND the wheel URL in
        # pyproject.toml, but every make target runs `uv run --frozen`, and
        # --frozen installs what uv.lock names without ever reading
        # pyproject.toml. Leave the lockfile behind and this job pulls the NEW
        # image, runs it against the OLD client, and passes -- verifying a pair
        # no consumer will ever have. Measured, not feared: with pyproject at
        # v0.2.5 and the lock at v0.2.4, `uv run --frozen` installed
        # databricks_target from the v0.2.4 wheel and said nothing.
        run: |
          uv run --no-project python scripts/set_release.py \
            "${GITHUB_EVENT_CLIENT_PAYLOAD_VERSION}"
          uv lock
          git --no-pager diff --stat versions.env pyproject.toml uv.lock
        env:
          GITHUB_EVENT_CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
      # The BYTES, not just the declaration. compose.py refuses without them:
      # mokapi serves the exports from _data/, and an unmaterialised checkout
      # stands up vendors that answer nothing.
      - name: Materialise the vendor exports
        run: make sources
        working-directory: contoso-sources
      - run: make doctor
      - run: make config
      - run: make up
      - run: make verify PRODUCT=../contoso-data-product-databricks-jobs
      # THE NUMBERS, not merely the run (G50). Everything above proves the
      # pipeline executed; this is the only step that can fail because gold
      # returned different money. The gold step writes product_snapshot.json and
      # until now nothing read it back, so a cell whose gold silently drifted
      # would have stayed green indefinitely.
      #
      # No `if: always()`. A failed run has no numbers worth checking, and a
      # missing snapshot after a SUCCESSFUL run is a finding the script reports
      # as one rather than skipping.
      - name: Assert the figures core publishes
        run: |
          python3 ../contoso-data-product/scripts/assert_snapshot.py \
            --label databricks-platform-jobs \
            ../contoso-data-product-databricks-jobs/product_snapshot.json
      - if: github.event_name == 'repository_dispatch'
        name: Adopt the version this run just verified
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet versions.env pyproject.toml uv.lock; then
            echo "already pinned at $VERSION; nothing to adopt"
            exit 0
          fi
          git commit -qm "pin $VERSION — adopted by the acceptance run that verified it" \
            versions.env pyproject.toml uv.lock
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "adopted $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make down
